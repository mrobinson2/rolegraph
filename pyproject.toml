[project]
name = "rolegraph"
version = "0.1.0"
description = "Self-hosted Azure RBAC access intelligence. See who has access to what - and exactly why."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rolegraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
