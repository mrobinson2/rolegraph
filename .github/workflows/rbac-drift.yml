name: RBAC drift scan (every 12 hours)

on:
  schedule:
    - cron: '23 0,12 * * *' # Every 12 hours: 00:23 and 12:23 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rbac-drift
  cancel-in-progress: false

jobs:
  scan:
    # Tenant data and scan artifacts belong in a private repository. Enable
    # after configuring rbac/approved and the rbac-audit federated identity.
    if: >-
      vars.RBAC_DRIFT_ENABLED == 'true' &&
      github.event.repository.private == true &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: rbac-audit
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install RoleGraph
        run: python -m pip install .
      - name: Validate approved target files
        run: python -m rolegraph.drift validate --target rbac/approved
      - uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read Azure and compare approved state
        run: python scripts/scan_rbac.py --target rbac/approved --output-dir artifacts/rbac --revision "$GITHUB_SHA"
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/rbac/report.md ]; then
            cat artifacts/rbac/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'RBAC scan did not complete. Review the failed setup, validation or authentication step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain scan evidence on success, drift or error
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rbac-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rbac/
          if-no-files-found: warn
          retention-days: 30
